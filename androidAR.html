<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Android AR Experience</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>
  <div id="info">Camera Position: X: 0, Y: 0, Z: 0</div>
  <div id="warning">Tracking lost - move device slowly to recover</div>
  <div id="loading">Loading model...</div>

  <div id="modelSelector">
    <div class="model-control">
      <label for="categoryDropdown">Choose your category:</label>
      <select id="categoryDropdown">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
      </select>
    </div>
    <div class="model-control">
      <label for="modelDropdown">Choose your model:</label>
      <select id="modelDropdown">
        <!-- Options will be populated dynamically based on category -->
      </select>
    </div>
    <button id="arButton" class="ar-button">Start AR</button>
  </div>

  <button id="exitButton">✕</button>

  <script src="androidAR.js"></script>
</body>
</html>
