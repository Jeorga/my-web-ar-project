<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Viewer for Android</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    button {
      margin: 8px;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #ar-button {
      background-color: #28a745;
    }

    model-viewer {
      width: 100%;
      max-width: 500px;
      height: 400px;
      margin: 20px auto;
    }
  </style>

  <!-- Google Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

  <h1>View 3D Models in AR (Android)</h1>

  <model-viewer id="viewer"
    alt="3D model"
    src=""
    ar
    ar-modes="scene-viewer"
    auto-rotate
    camera-controls
    shadow-intensity="1">
  </model-viewer>

  <!-- Buttons to choose models -->
  <div>
    <button onclick="selectModel('aoiBa.glb')">Model A</button>
    <button onclick="selectModel('aoiBa_draco.glb')">Model B</button>
    <button onclick="selectModel('aoi_tripo_pbr.glb')">Model C</button>
  </div>

  <button id="ar-button" onclick="launchAR()">View in AR</button>

  <script src="main.js"></script>

</body>
</html>
